<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #05010d; overflow: hidden;
    font-family: 'Arial Black', Arial, sans-serif;
  }
  .stage {
    position: relative;
    width: 100vw; height: 100vh;
    overflow: hidden;
  }
  .frame {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    opacity: 0;
    animation: cycle 20s infinite;
  }
  .frame svg { width: 100%; height: 100%; display: block; }

  .frame:nth-child(1) { animation-delay: 0s; }
  .frame:nth-child(2) { animation-delay: 4s; }
  .frame:nth-child(3) { animation-delay: 8s; }
  .frame:nth-child(4) { animation-delay: 12s; }
  .frame:nth-child(5) { animation-delay: 16s; }

  @keyframes cycle {
    0%   { opacity: 0; }
    2%   { opacity: 1; }
    18%  { opacity: 1; }
    22%  { opacity: 0; }
    100% { opacity: 0; }
  }

  .sunGlow { animation: pulse 3s ease-in-out infinite; transform-origin: center; }
  @keyframes pulse {
    0%, 100% { filter: brightness(1); }
    50%      { filter: brightness(1.15); }
  }

  .scan { animation: scanmove 6s linear infinite; }
  @keyframes scanmove {
    0%   { transform: translateY(0); }
    100% { transform: translateY(20px); }
  }

  .title {
    animation: flicker 3.5s infinite;
  }
  @keyframes flicker {
    0%, 92%, 100% { opacity: 1; }
    93% { opacity: 0.6; }
    94% { opacity: 1; }
    95% { opacity: 0.7; }
    96% { opacity: 1; }
  }
</style>
</head>
<body>
<div class="stage">

  <!-- FRAME 1: Purple/Pink classic -->
  <div class="frame">
    <svg viewBox="0 0 1376 768" preserveAspectRatio="xMidYMid slice">
      <defs>
        <radialGradient id="sky1" cx="50%" cy="30%" r="80%">
          <stop offset="0%" stop-color="#2a0a3d"/>
          <stop offset="100%" stop-color="#05010d"/>

          <stop offset="0%" stop-color="#c084fc"/>
          <stop offset="50%" stop-color="#f472b6"/>
          <stop offset="100%" stop-color="#fbbf24"/>
        </linearGradient>
        <linearGradient id="grid1" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ff2fd6" stop-opacity="0.9"/>
          <stop offset="100%" stop-color="#ff2fd6" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <rect width="1376" height="768" fill="url(#sky1)"/>
      <g class="sunGlow">
        <circle cx="688" cy="330" r="220" fill="url(#sun1)"/>
        <g stroke="#2a0a3d" stroke-width="10">
          <line x1="468" y1="300" x2="908" y2="300"/>
          <line x1="468" y1="330" x2="908" y2="330"/>
          <line x1="468" y1="365" x2="908" y2="365"/>
          <line x1="468" y1="405" x2="908" y2="405"/>
        </g>
      </g>
      <g fill="#0d0518">
        <rect x="60" y="380" width="60" height="300"/>
        <rect x="150" y="320" width="80" height="360"/>
        <rect x="260" y="420" width="50" height="260"/>
        <rect x="950" y="400" width="70" height="280"/>
        <rect x="1050" y="330" width="90" height="350"/>
        <rect x="1180" y="450" width="55" height="230"/>
        <rect x="580" y="220" width="60" height="480"/>
        <rect x="660" y="180" width="70" height="520"/>
        <rect x="750" y="260" width="55" height="440"/>
      </g>
      <rect x="0" y="600" width="1376" height="168" fill="url(#grid1)"/>
      <g class="scan" stroke="#ff2fd6" stroke-width="2" opacity="0.5">
        <line x1="0" y1="620" x2="1376" y2="620"/>
        <line x1="0" y1="660" x2="1376" y2="660"/>
        <line x1="0" y1="700" x2="1376" y2="700"/>
      </g>
      <text x="688" y="720" text-anchor="middle" class="title" font-size="70" fill="#ff2fd6" stroke="#fff" stroke-width="1" style="letter-spacing:6px;">RETROCITY</text>
    </svg>
  </div>

</html>
